name: RightFlow synthetic CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rightflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, types and build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      QWEN_API_KEY: ""
      DASHSCOPE_API_KEY: ""
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install lockfile-pinned dependencies
        run: npm ci --no-fund
      - name: Synthetic unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build without provider credentials
        run: npm run build
